name: Build Geode Mod

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest

      - uses: actions/upload-artifact@v4
        with:
          name: compiled-mod-Windows
          path: build/*.geode
